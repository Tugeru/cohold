name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare env
        run: cp .env.example .env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Wasm target
        run: rustup target add wasm32v1-none

      - name: Test
        run: cargo test

      - name: Build Wasm
        run: cargo build --release --target wasm32v1-none

      - name: Install stellar CLI
        run: |
          curl -fsSLo /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin

      - name: Regenerate bindings and fail on drift
        run: |
          npm run contract:bindings
          git diff --exit-code -- packages/cohold-contract
